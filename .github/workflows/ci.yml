name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalogue_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - run: go build ./...
      - run: go vet ./...
      - name: Formatting
        run: |
          u=$(gofmt -l .)
          if [ -n "$u" ]; then echo "gofmt would change:"; echo "$u"; exit 1; fi

      # The ranking has to be testable without a database, and a skip that
      # becomes permanent is how that stops being true.
      - name: Test with nothing external
        run: go test -race ./...

      - name: Test against Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/catalogue_test?sslmode=disable
        run: go test -race ./...

      # The reservation race is the thing this repository is about, so it is
      # run several times rather than once: a race that only shows up
      # sometimes is still a race.
      - name: Hammer the reservation race
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/catalogue_test?sslmode=disable
        run: go test -race -count=10 ./internal/store/postgres/ -run TestOnlyOneBasket
